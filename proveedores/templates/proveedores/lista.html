{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Proveedores</h2>
<a href="{% url 'crear_proveedor' %}" class="btn btn-primary">Nuevo Proveedor</a>
<table class="min-w-full bg-white border border-gray-200">
    <thead>
        <tr>
            <th class="py-2 px-4 border-b">Nombre</th>
            <th class="py-2 px-4 border-b">Ruc</th>
            <th class="py-2 px-4 border-b">Direccion</th>
            <th class="py-2 px-4 border-b">Teléfono</th>
            <th class="py-2 px-4 border-b">Email</th>
        </tr>
    </thead>
    <tbody>
        {% for proveedor in proveedores %}
        <tr class="hover:bg-gray-100">
            <td class="py-2 px-4 border-b">{{ proveedor.nombre }}</td>
            <td class="py-2 px-4 border-b">{{ proveedor.ruc }}</td>
            <td class="py-2 px-4 border-b">{{ proveedor.direccion }}</td>
            <td class="py-2 px-4 border-b">{{ proveedor.telefono }}</td>
            <td class="py-2 px-4 border-b">{{ proveedor.email }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
