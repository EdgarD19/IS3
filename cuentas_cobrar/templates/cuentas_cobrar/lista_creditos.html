{% extends 'base.html' %}

{% block content %}
<h2>Lista de Créditos</h2>
<ul>
    {% for credito in creditos %}
    <li>
        {{ credito }} - Cliente: {{ credito.cliente.nombre }} - Monto: {{ credito.monto }} Gs.
        <a href="{% url 'detalle_cuotas' credito.id %}" class="btn btn-info" style="padding: 5px 15px; background: #007bff; color: white; border-radius: 4px; text-decoration: none;">Ver Cuotas</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
