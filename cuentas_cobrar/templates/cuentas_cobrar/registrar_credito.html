{% extends 'base.html' %}

{% block content %}
<h2>Registrar Crédito</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrar Crédito</button>
</form>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        function toggleDiasVencimiento() {
            var modalidad = document.getElementById('id_modalidad');
            var diasField = document.getElementById('id_dias_vencimiento').parentElement;
            if (modalidad.value === 'personalizada') {
                diasField.style.display = '';
            } else {
                diasField.style.display = 'none';
            }
        }
        var modalidad = document.getElementById('id_modalidad');
        if (modalidad) {
            modalidad.addEventListener('change', toggleDiasVencimiento);
            toggleDiasVencimiento();
        }
    });
</script>
{% endblock %}
